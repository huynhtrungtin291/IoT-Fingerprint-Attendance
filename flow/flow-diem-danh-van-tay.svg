<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="1302" viewBox="0 0 1270 1302" role="img"><title>Điểm danh bằng vân tay</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#57738e"/></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#142842}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#17616a}.h{font-size:41px;font-weight:750}.sub{font-size:18px;fill:#435d73}.step{font-size:19px;font-weight:700}.api{font-size:16px;font-weight:650;fill:#075e67}.body{font-size:16px;fill:#30495f}.num{font-size:16px;font-weight:700;fill:white}.branch{font-size:15px;fill:#694419}.error{font-size:15px;fill:#912c39}</style>
<rect width="1270" height="1302" fill="#f0f5f9"/>
<text x="46" y="38" class="k">IOT FINGERPRINT ATTENDANCE / 02</text><text x="46" y="88" class="h">Điểm danh bằng vân tay</text><text x="46" y="119" class="sub">ESP32 gửi mẫu → backend xác định sinh viên, buổi học và kết quả.</text>
<text x="94" y="151" class="k">LUỒNG CHÍNH</text><text x="900" y="151" class="k">NHÁNH XỬ LÝ / GHI CHÚ</text><path d="M448 309v15" stroke="#57738e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M851 238h29" stroke="#57738e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="46" y="166" width="804" height="143" rx="12" fill="#ffffff" stroke="#bfd0dd"/><circle cx="70" cy="192" r="13" fill="#116773"/><text x="65" y="198" class="num">1</text><text x="94" y="199" class="step">Web · Chuẩn bị buổi học</text><text x="94" y="223" class="api">POST /enrollments/create  ·  PATCH /sessions/:id</text><text x="94" y="246" class="body">Sinh viên có enrollment trong lớp học phần. Buổi học ở trạng thái</text><text x="94" y="264" class="body">open và cùng roomId với thiết bị. Máy và mẫu vân tay đều active.</text><rect x="885" y="190" width="342" height="96" rx="12" fill="#fff8ec" stroke="#e1c59e"/><text x="900" y="212" class="branch">Bearer access token cho các API chuẩn bị.</text><path d="M448 470v15" stroke="#57738e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M851 399h29" stroke="#57738e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="46" y="327" width="804" height="143" rx="12" fill="#ffffff" stroke="#bfd0dd"/><circle cx="70" cy="353" r="13" fill="#116773"/><text x="65" y="359" class="num">2</text><text x="94" y="360" class="step">Sinh viên và ESP32 · Quét và gửi mẫu</text><text x="94" y="384" class="api">POST /attendance/device-check-in</text><text x="94" y="407" class="body">JSON gồm deviceCode, authSecret, templateData, timestamp.</text><text x="94" y="425" class="body">timestamp là ngày giờ ISO 8601. Thiết bị xác thực bằng JSON body.</text><rect x="885" y="351" width="342" height="96" rx="12" fill="#fff8ec" stroke="#e1c59e"/><text x="900" y="373" class="branch">400 · Payload hoặc timestamp sai.</text><path d="M448 631v15" stroke="#57738e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M851 560h29" stroke="#57738e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="46" y="488" width="804" height="143" rx="12" fill="#ffffff" stroke="#bfd0dd"/><circle cx="70" cy="514" r="13" fill="#116773"/><text x="65" y="520" class="num">3</text><text x="94" y="521" class="step">Backend · Kiểm tra máy và đồng hồ</text><text x="94" y="545" class="api">Xác thực → kiểm tra timestamp → cập nhật lastSeenAt</text><text x="94" y="568" class="body">Kiểm tra mã máy, secret và trạng thái active.</text><text x="94" y="586" class="body">Độ lệch giữa timestamp và giờ server tối đa 5 phút.</text><rect x="885" y="512" width="342" height="96" rx="12" fill="#fff8ec" stroke="#e1c59e"/><text x="900" y="534" class="branch">401 · Sai mã máy/secret hoặc máy bị tắt.</text><text x="900" y="553" class="branch">400 · Đồng hồ máy lệch quá 5 phút.</text><path d="M448 792v15" stroke="#57738e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M851 721h29" stroke="#57738e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="46" y="649" width="804" height="143" rx="12" fill="#ffffff" stroke="#bfd0dd"/><circle cx="70" cy="675" r="13" fill="#116773"/><text x="65" y="681" class="num">4</text><text x="94" y="682" class="step">Backend · Xác định sinh viên</text><text x="94" y="706" class="api">Đối chiếu với các mẫu vân tay active</text><text x="94" y="729" class="body">Backend dùng PasswordHasher.verify với hash đã lưu.</text><text x="94" y="747" class="body">Chuỗi mẫu gửi lên phải trùng chuỗi đã băm khi đăng ký.</text><text x="94" y="765" class="body">Lấy studentId từ mẫu đầu tiên khớp.</text><rect x="885" y="673" width="342" height="96" rx="12" fill="#fff8ec" stroke="#e1c59e"/><text x="900" y="695" class="branch">404 · Không có mẫu khớp.</text><path d="M448 953v15" stroke="#57738e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M851 882h29" stroke="#57738e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="46" y="810" width="804" height="143" rx="12" fill="#ffffff" stroke="#bfd0dd"/><circle cx="70" cy="836" r="13" fill="#116773"/><text x="65" y="842" class="num">5</text><text x="94" y="843" class="step">Backend · Tìm buổi học tại phòng của máy</text><text x="94" y="867" class="api">roomId của thiết bị → session có status = open</text><text x="94" y="890" class="body">Dùng giờ server và nhận cả hai đầu mốc mở/đóng điểm danh.</text><text x="94" y="908" class="body">Nếu thiếu từng mốc, dùng startTime hoặc endTime tương ứng.</text><rect x="885" y="834" width="342" height="96" rx="12" fill="#fff8ec" stroke="#e1c59e"/><text x="900" y="856" class="branch">400 · Không có buổi học đang nhận</text><text x="900" y="875" class="branch">điểm danh tại phòng này.</text><path d="M448 1114v15" stroke="#57738e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M851 1043h29" stroke="#57738e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="46" y="971" width="804" height="143" rx="12" fill="#ffffff" stroke="#bfd0dd"/><circle cx="70" cy="997" r="13" fill="#116773"/><text x="65" y="1003" class="num">6</text><text x="94" y="1004" class="step">Backend · Kiểm tra ghi danh và trùng</text><text x="94" y="1028" class="api">Kiểm tra enrollment → kiểm tra attendance</text><text x="94" y="1051" class="body">Enrollment phải khớp cặp sectionId + studentId.</text><text x="94" y="1069" class="body">Mỗi cặp sessionId + studentId có một bản ghi điểm danh.</text><rect x="885" y="995" width="342" height="96" rx="12" fill="#fff8ec" stroke="#e1c59e"/><text x="900" y="1017" class="branch">400 · Sinh viên chưa ghi danh lớp học phần.</text><text x="900" y="1036" class="branch">409 · Đã có bản ghi trong buổi này.</text><path d="M851 1204h29" stroke="#57738e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="46" y="1132" width="804" height="143" rx="12" fill="#ffffff" stroke="#bfd0dd"/><circle cx="70" cy="1158" r="13" fill="#116773"/><text x="65" y="1164" class="num">7</text><text x="94" y="1165" class="step">Backend → ESP32 · Trả kết quả</text><text x="94" y="1189" class="api">HTTP 201 · Bản ghi điểm danh</text><text x="94" y="1212" class="body">Giờ server &gt; startTime → late. Còn lại → present.</text><text x="94" y="1230" class="body">Lưu method: fingerprint, deviceId: deviceCode,</text><text x="94" y="1248" class="body">checkInTime và receivedAt bằng giờ server.</text><rect x="885" y="1156" width="342" height="96" rx="12" fill="#fff8ec" stroke="#e1c59e"/><text x="900" y="1178" class="branch">Web xem kết quả qua GET /attendance</text><text x="900" y="1197" class="branch">hoặc GET /attendance/:id với Bearer token.</text></svg>
