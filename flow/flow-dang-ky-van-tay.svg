<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="1141" viewBox="0 0 1270 1141" role="img"><title>Đăng ký vân tay</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#57738e"/></marker></defs>
<style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#142842}.k{font-size:14px;font-weight:700;letter-spacing:2px;fill:#17616a}.h{font-size:41px;font-weight:750}.sub{font-size:18px;fill:#435d73}.step{font-size:19px;font-weight:700}.api{font-size:16px;font-weight:650;fill:#075e67}.body{font-size:16px;fill:#30495f}.num{font-size:16px;font-weight:700;fill:white}.branch{font-size:15px;fill:#694419}.foot{font-size:14px;fill:#435d73}</style>
<rect width="1270" height="1141" fill="#f0f5f9"/>
<text x="46" y="38" class="k">IOT FINGERPRINT ATTENDANCE / 01</text><text x="46" y="88" class="h">Đăng ký vân tay</text><text x="46" y="119" class="sub">Giảng viên tạo lượt → ESP32 nhận lượt → lưu mẫu và hoàn tất.</text>
<text x="94" y="151" class="k">LUỒNG CHÍNH</text><text x="900" y="151" class="k">NHÁNH XỬ LÝ / GHI CHÚ</text><path d="M448 309v15" stroke="#57738e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M851 238h29" stroke="#57738e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="46" y="166" width="804" height="143" rx="12" fill="#ffffff" stroke="#bfd0dd"/><circle cx="70" cy="192" r="13" fill="#116773"/><text x="65" y="198" class="num">1</text><text x="94" y="199" class="step">Giảng viên · Đăng nhập</text><text x="94" y="223" class="api">POST /auth/signin</text><text x="94" y="246" class="body">Gửi userName và password, lấy accessToken.</text><rect x="885" y="190" width="342" height="96" rx="12" fill="#fff8ec" stroke="#e1c59e"/><text x="900" y="212" class="branch">401 · Thông tin đăng nhập sai.</text><path d="M448 470v15" stroke="#57738e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M851 399h29" stroke="#57738e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="46" y="327" width="804" height="143" rx="12" fill="#ffffff" stroke="#bfd0dd"/><circle cx="70" cy="353" r="13" fill="#116773"/><text x="65" y="359" class="num">2</text><text x="94" y="360" class="step">Giảng viên · Tạo lượt đăng ký</text><text x="94" y="384" class="api">POST /fingerprint-registrations</text><text x="94" y="407" class="body">Bearer của teacher · studentId, deviceId, fingerPosition.</text><text x="94" y="425" class="body">201 · registrationId, status: pending, expiresAt = giờ tạo + 5 phút.</text><rect x="885" y="351" width="342" height="96" rx="12" fill="#fff8ec" stroke="#e1c59e"/><text x="900" y="373" class="branch">400 · Dữ liệu sai.</text><text x="900" y="392" class="branch">401/403 · Token hoặc vai trò không hợp lệ.</text><text x="900" y="411" class="branch">404 · Thiếu sinh viên hoặc thiết bị.</text><text x="900" y="430" class="branch">409 · Thiết bị không active.</text><path d="M448 631v15" stroke="#57738e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M851 560h29" stroke="#57738e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="46" y="488" width="804" height="143" rx="12" fill="#ffffff" stroke="#bfd0dd"/><circle cx="70" cy="514" r="13" fill="#116773"/><text x="65" y="520" class="num">3</text><text x="94" y="521" class="step">ESP32 · Hỏi lượt chờ của máy</text><text x="94" y="545" class="api">GET /devices/me/pending-registration</text><text x="94" y="568" class="body">X-Device-Code và X-Device-Secret. Backend xác thực máy,</text><text x="94" y="586" class="body">cập nhật lastSeenAt và chuyển lượt quá hạn sang expired.</text><text x="94" y="604" class="body">200 · Lượt pending cũ nhất còn hạn: registrationId,</text><text x="94" y="622" class="body">studentCode, fingerPosition, status, expiresAt.</text><rect x="885" y="512" width="342" height="96" rx="12" fill="#fff8ec" stroke="#e1c59e"/><text x="900" y="534" class="branch">401 · Máy hoặc secret không hợp lệ.</text><text x="900" y="553" class="branch">204 · Chưa có lượt. ESP32 tiếp tục hỏi.</text><path d="M448 792v15" stroke="#57738e" stroke-width="2"  marker-end="url(#arrow)"/><path d="M851 721h29" stroke="#57738e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="46" y="649" width="804" height="143" rx="12" fill="#ffffff" stroke="#bfd0dd"/><circle cx="70" cy="675" r="13" fill="#116773"/><text x="65" y="681" class="num">4</text><text x="94" y="682" class="step">Sinh viên và ESP32 · Quét ngón tay</text><text x="94" y="706" class="api">Cảm biến vân tay</text><text x="94" y="729" class="body">ESP32 nhắc đặt đúng ngón theo fingerPosition và thu templateData.</text><rect x="885" y="673" width="342" height="96" rx="12" fill="#fff8ec" stroke="#e1c59e"/><text x="900" y="695" class="branch">Nếu chưa lấy được mẫu, quét lại</text><text x="900" y="714" class="branch">trong thời hạn của lượt đăng ký.</text><path d="M448 953v15" stroke="#57738e" stroke-width="2" marker-end="url(#arrow)"/><path d="M851 882h29" stroke="#57738e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="46" y="810" width="804" height="143" rx="12" fill="#ffffff" stroke="#bfd0dd"/><circle cx="70" cy="836" r="13" fill="#116773"/><text x="65" y="842" class="num">5</text><text x="94" y="843" class="step">ESP32 → Backend · Gửi mẫu</text><text x="94" y="867" class="api">POST /fingerprints/create</text><text x="94" y="890" class="body">Header: X-Device-Code và X-Device-Secret.</text><text x="94" y="908" class="body">Body: registrationId, templateData,</text><text x="94" y="926" class="body">templateFormat và algorithmVersion.</text><rect x="885" y="834" width="342" height="96" rx="12" fill="#fff8ec" stroke="#e1c59e"/><text x="900" y="856" class="branch">400 · Thiếu trường hoặc dữ liệu sai.</text><text x="900" y="875" class="branch">Dùng registrationId từ bước 3.</text><path d="M851 1043h29" stroke="#57738e" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/><rect x="46" y="971" width="804" height="143" rx="12" fill="#ffffff" stroke="#83a3ac"/><circle cx="70" cy="997" r="13" fill="#116773"/><text x="65" y="1003" class="num">6</text><text x="94" y="1004" class="step">Backend · Lưu mẫu và hoàn tất</text><text x="94" y="1028" class="api">HTTP 201 · Khi request qua kiểm tra và lưu thành công</text><text x="94" y="1051" class="body">Kiểm tra lượt thuộc máy, còn hạn và đúng trạng thái.</text><text x="94" y="1069" class="body">Trong một giao dịch: pending → processing → completed.</text><text x="94" y="1087" class="body">Lấy sinh viên và ngón từ lượt. Băm và lưu mẫu active.</text><text x="94" y="1105" class="body">Trả registrationId, fingerprintId, status: completed.</text><rect x="885" y="995" width="342" height="96" rx="12" fill="#fff8ec" stroke="#e1c59e"/><text x="900" y="1017" class="branch">400 · Lượt pending đã hết hạn.</text><text x="900" y="1036" class="branch">401 · Máy xác thực thất bại.</text><text x="900" y="1055" class="branch">404 · Lượt không thuộc máy hoặc thiếu SV.</text><text x="900" y="1074" class="branch">409 · Trùng ngón hoặc lượt hết chờ.</text><text x="46" y="1134" class="foot">Gửi lại lượt completed của cùng thiết bị → trả lại ID mẫu đã lưu nếu mẫu còn tồn tại.</text></svg>
